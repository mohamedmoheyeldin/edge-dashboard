name: Release

# Pushing a version tag (v1.0.1, v1.2.0, ...) builds the app and its installer on a GitHub
# Windows machine and publishes a release with the installer attached.
on:
  push:
    tags: ['v*']
  # "Run workflow" button: builds the installer as a test without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11.0.x

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the installer
        shell: pwsh
        run: .\installer\build.ps1 -Version ("${{ github.ref_type == 'tag' && github.ref_name || 'v0.0.0' }}" -replace '^v', '')

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          gh release create "${{ github.ref_name }}" $installer --title "Edge Dashboard $("${{ github.ref_name }}" -replace '^v', '')" --generate-notes
